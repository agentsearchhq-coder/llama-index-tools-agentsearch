[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-agentsearch"
version = "0.5.0"
description = "llama-index tools agentsearch integration: free live web search, plus pay-per-call news, extract, JS render, screenshots and search-and-read"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["llama-index-core>=0.12,<0.15", "httpx>=0.25", "pydantic>=2"]
keywords = ["llama-index", "llamaindex", "agentsearch", "web-search", "tools", "agents", "x402"]

[project.optional-dependencies]
paid = ["x402[evm]>=2.0"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/agentsearchhq-coder/llama-index-tools-agentsearch"
Issues = "https://github.com/agentsearchhq-coder/llama-index-tools-agentsearch/issues"
Homepage = "https://agentsearchhq.com/?utm_source=llama-index-tools-agentsearch&utm_medium=package"
Documentation = "https://agentsearchhq.com/agents.md?utm_source=llama-index-tools-agentsearch&utm_medium=package"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.hatch.build.targets.sdist]
include = ["llama_index", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.agentsearch"

[tool.llamahub.class_authors]
AgentSearchToolSpec = "agentsearchhq"
